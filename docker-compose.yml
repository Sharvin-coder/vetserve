services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # inside the container, "localhost" is the container itself; reach the
      # host's Ollama through the docker gateway instead
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
