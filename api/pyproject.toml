[project]
name = "vetserve-api"
version = "0.1.0"
description = "VetServe Katy API — VetGuide RAG + Task Board"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "supabase>=2.7",
    "openai>=1.40",
    "pymupdf>=1.24",
    "trafilatura>=1.12",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "sse-starlette>=2.1",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
